# Builds and tests on Windows, macOS and Linux.
# Every run keeps the three packages as workflow artifacts; pushing a tag like v0.5.0 also
# attaches them to the GitHub release of that tag (the release is created if it does not exist).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: macos-universal, os: macos-latest }
          # an older Ubuntu, so the binary also runs on distributions with an older glibc
          - { name: linux-x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build.ps1
          Copy-Item README.md, README.ko.md, LICENSE, register.ps1, ui/vendor/tex2typst.LICENSE.txt dist
          Copy-Item examples dist -Recurse
          Compress-Archive -Path dist/* -DestinationPath EasyTypstEditor-${{ matrix.name }}.zip

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          UNIVERSAL=1 sh build.sh
          cp README.md README.ko.md LICENSE ui/vendor/tex2typst.LICENSE.txt dist/
          cp -R examples dist/
          # ditto keeps the app's permissions and signature inside the zip
          ditto -c -k dist EasyTypstEditor-${{ matrix.name }}.zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sh build.sh
          cp README.md README.ko.md LICENSE ui/vendor/tex2typst.LICENSE.txt dist/
          cp -R examples dist/
          tar -czf EasyTypstEditor-${{ matrix.name }}.tar.gz --transform 's,^dist,EasyTypstEditor,' dist

      - uses: actions/upload-artifact@v4
        with:
          name: EasyTypstEditor-${{ matrix.name }}
          path: |
            EasyTypstEditor-*.zip
            EasyTypstEditor-*.tar.gz
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # EasyTypstEditor-windows-x64.zip -> EasyTypstEditor-v0.5.0-windows-x64.zip
          for f in packages/EasyTypstEditor-*; do
            mv "$f" "packages/EasyTypstEditor-$TAG-${f#packages/EasyTypstEditor-}"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Easy Typst Editor $TAG" --generate-notes
          gh release upload "$TAG" packages/* --repo "$GITHUB_REPOSITORY" --clobber
