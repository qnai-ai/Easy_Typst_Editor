[package]
name = "easy-typst-editor"
version = "0.1.0"
edition = "2021"
description = "Edit Typst documents directly on the rendered page (Windows)"
license = "MIT"
repository = "https://github.com/qnai-ai/Easy_Typst_Editor"
keywords = ["typst", "editor", "wysiwyg", "typesetting"]

[[bin]]
name = "EasyTypstEditor"
path = "src/main.rs"

[dependencies]
typst = "0.15.1"
typst-syntax = "0.15.1"
typst-svg = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts"] }
typst-layout = "0.15.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
wry = "0.57"
tao = "0.37"
rfd = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
opt-level = 3
